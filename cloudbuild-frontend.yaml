steps:
  - name: node:22
    dir: Frontend
    env:
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    script: |
      npm ci
      npm run build
  - name: gcr.io/cloud-builders/gsutil
    args:
      - -m
      - rsync
      - -r
      - Frontend/dist
      - gs://${_FRONTEND_BUCKET}

substitutions:
  _VITE_API_BASE_URL: https://todo-458237170651.europe-west3.run.app
  _VITE_SUPABASE_URL: https://your-project-ref.supabase.co
  _VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: your-publishable-key
  _FRONTEND_BUCKET: cloud-todo

options:
  logging: CLOUD_LOGGING_ONLY
